<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — TX RetailOS</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <button id="menuToggle" class="icon-btn">☰</button>
      <h1 class="app-title">TX RetailOS</h1>
    </div>
    <div class="topbar-right">
      <span id="userInfo" class="text-mono"></span>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h2>Products</h2>
      </div>

      <div class="form-group mt-2">
        <input type="text" id="productSearch" placeholder="Search products by name..." />
      </div>

      <div id="loadingState" class="text-muted mt-2">
        Loading items...
      </div>

      <div id="errorState" class="login-error mt-2" hidden>
        Could not load items. Check your connection to the store PC.
      </div>

      <div id="emptyState" class="text-muted mt-2" hidden>
        No items found. Add your first product to get started.
      </div>

      <div id="productList" class="product-grid mt-3" hidden></div>
    </main>
  </div>

  <script type="module">
    import { getItems } from '../services/api.js';
    import { requireAuth, getCurrentUser, logout } from '../modules/auth.js';
    import { renderSidebar } from '../modules/nav.js';

    requireAuth();
    const user = getCurrentUser();
    document.getElementById('userInfo').textContent = user ? `${user.name} (${user.role})` : '';
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await logout();
      window.location.href = 'login.html';
    });
    renderSidebar('items.html');
    document.getElementById('menuToggle').onclick = () =>
      document.getElementById('sidebar').classList.toggle('collapsed');

    const loadingState = document.getElementById('loadingState');
    const errorState   = document.getElementById('errorState');
    const emptyState   = document.getElementById('emptyState');
    const productList  = document.getElementById('productList');
    const searchInput  = document.getElementById('productSearch');

    let allProducts = [];

    function renderItems(items) {
      loadingState.hidden = true;

      if (!items || items.length === 0) {
        emptyState.hidden = false;
        productList.hidden = true;
        return;
      }
      emptyState.hidden = true;
      productList.hidden = false;
      productList.innerHTML = items.map(product => `
        <article class="card product-card">
          <div class="product-name">${product.name}</div>
          <div class="product-category text-faint text-mono">
            ${product.category || 'Uncategorised'}
          </div>
          <div class="product-meta mt-2">
            <div class="product-price">
              <span class="text-faint">Price</span>
              <span class="text-accent">₦${Number(product.selling_price).toLocaleString()}</span>
            </div>
            <div class="product-stock ${product.stock_quantity <= 5 ? 'stock-low' : ''}">
              <span class="text-faint">Stock</span>
              <span>${product.stock_quantity} units</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    // Client-side search over the already-fetched real list — no search endpoint exists
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q ? allProducts.filter(p => p.name.toLowerCase().includes(q)) : allProducts;
      renderItems(filtered);
    });

    async function loadItems() {
      try {
        const data = await getItems();
        allProducts = data.items || [];
        renderItems(allProducts);
      } catch (err) {
        loadingState.hidden = true;
        errorState.hidden = false;
        console.error('Failed to load items:', err);
      }
    }

    loadItems();
  </script>

</body>
</html>

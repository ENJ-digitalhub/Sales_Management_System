<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Dashboard — Sales Management System</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>

<body>

  <header class="topbar">
    <div class="topbar-left">
      <button id="menuToggle" class="icon-btn">☰</button>
      <h1 class="app-title">TX RetailOS</h1>
    </div>
    <div class="topbar-right">
      <button id="notifBtn" class="icon-btn">🔔</button>
      <span id="userInfo" class="text-mono"></span>
      <span class="status online">● Online</span>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <div id="offlineNotice" class="soon-card mt-2" hidden>
    Offline Mode & Sync — Coming Soon. You're currently offline; reconnect to continue.
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h2>Sales Dashboard</h2>
      </div>

      <div class="item-grid mt-3" id="itemList"></div>

      <div class="card mt-3">
        <h3>Cart</h3>
        <div id="cartItems" class="mt-2"></div>
        <div class="mt-2"><strong>Total: ₦<span id="cartTotal">0</span></strong></div>

        <div class="form-group mt-3">
          <label>Payment Method</label>
          <div>
            <button class="btn btn-outline" data-method="cash">Cash</button>
            <button class="btn btn-outline" data-method="transfer">Transfer</button>
            <button class="btn btn-outline" data-method="pos">POS</button>
          </div>
        </div>

        <button class="btn btn-primary btn-block mt-2" id="completeSaleBtn">Complete Sale</button>
        <div id="saleError" class="login-error mt-2" hidden></div>
      </div>
    </main>
  </div>

  <div id="notifModal" class="modal hidden">
    <div class="modal-content">
      <div class="flex-between">
        <h3>Notifications</h3>
        <button id="closeNotif" class="icon-btn">✕</button>
      </div>
      <div class="placeholder">
        🔔 No new notifications yet.
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, getCurrentUser, logout } from '../modules/auth.js';
    import { renderSidebar } from '../modules/nav.js';
    import { enqueue } from '../modules/queue.js';
    import { getItems, createSale } from '../services/api.js';

    requireAuth();
    const user = getCurrentUser();
    document.getElementById('userInfo').textContent = user ? `${user.name} (${user.role})` : '';
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await logout();
      window.location.href = 'login.html';
    });
    renderSidebar('sales.html');
    document.getElementById('menuToggle').onclick = () =>
      document.getElementById('sidebar').classList.toggle('collapsed');

    // Notifications (shared shell — no new functionality)
    document.getElementById('notifBtn').onclick = () =>
      document.getElementById('notifModal').classList.remove('hidden');
    document.getElementById('closeNotif').onclick = () =>
      document.getElementById('notifModal').classList.add('hidden');

    const cart = new Map();
    let paymentMethod = null;
    let items = [];

    function renderOfflineBanner() {
      document.getElementById('offlineBanner').hidden = navigator.onLine;
    }
    window.addEventListener('online', renderOfflineBanner);
    window.addEventListener('offline', renderOfflineBanner);
    renderOfflineBanner();

    async function loadItems() {
      const data = await getItems();
      items = data.items || [];
      renderItems();
    }

    function renderItems() {
      const el = document.getElementById('itemList');
      el.innerHTML = items.map(p => `
        <article class="card item-card">
          <div class="item-name">${p.name}</div>
          <div class="item-meta mt-2">
            <span class="text-accent">₦${Number(p.selling_price).toLocaleString()}</span>
            <span class="${p.stock_quantity <= 5 ? 'stock-low' : ''}">${p.stock_quantity} in stock</span>
          </div>
          <button class="btn btn-outline mt-2" data-add="${p.id}">Add to cart</button>
        </article>
      `).join('');

      el.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => addToCart(btn.dataset.add));
      });
    }

    function addToCart(itemId) {
      const item = items.find(p => p.id === itemId);
      if (!item) return;
      const existing = cart.get(itemId);
      cart.set(itemId, { item, quantity: existing ? existing.quantity + 1 : 1 });
      renderCart();
    }

    function renderCart() {
      const el = document.getElementById('cartItems');
      let total = 0;
      el.innerHTML = [...cart.values()].map(({ item, quantity }) => {
        const lineTotal = item.selling_price * quantity;
        total += lineTotal;
        return `
          <div class="page-header">
            <span>${item.name} × ${quantity}</span>
            <span>
              ₦${lineTotal.toLocaleString()}
              <button class="btn btn-ghost" data-remove="${item.id}">✕</button>
            </span>
          </div>
        `;
      }).join('') || '<p class="text-muted">Cart is empty</p>';

      document.getElementById('cartTotal').textContent = total.toLocaleString();

      el.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => { cart.delete(btn.dataset.remove); renderCart(); });
      });
    }

    document.querySelectorAll('[data-method]').forEach(btn => {
      btn.addEventListener('click', () => {
        paymentMethod = btn.dataset.method;
        document.querySelectorAll('[data-method]').forEach(b => b.classList.remove('btn-primary'));
        btn.classList.add('btn-primary');
      });
    });

    async function completeSale() {
      const errorEl = document.getElementById('saleError');
      errorEl.hidden = true;
      if (cart.size === 0) return showError('Cart is empty');
      if (!paymentMethod) return showError('Select a payment method');
      if (!confirm('Complete this sale?')) return;

      const payload = {
        items: [...cart.values()].map(({ item, quantity }) => ({ item_id: item.id, quantity })),
        payment_method: paymentMethod,
      };

      try {
        await createSale(payload);
        alert('Sale completed');
        cart.clear();
        paymentMethod = null;
        renderCart();
        loadItems();
      } catch (err) {
        showError(err.message || 'Could not complete sale. Please try again.');
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('saleError');
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }

    document.getElementById('completeSaleBtn').addEventListener('click', completeSale);

    loadItems();
  </script>
</body>

</html>

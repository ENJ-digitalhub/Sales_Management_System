<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sales Management System</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="shortcut icon" href="../assets/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/app-icon-192.png">
  <meta name="theme-color" content="#0B0D10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>

  <header class="site-header">
    <div class="container">
      <h1>Sales Management System</h1>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="login-wrap">

        <div class="card login-card">
          <h2>Sign in</h2>
          <p>Enter your credentials to access the system.</p>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. john_doe" autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password"
              autocomplete="current-password">
          </div>

          <div id="loginError" class="login-error" hidden>
            Invalid username or password.
          </div>

          <button class="btn btn-primary btn-block" id="loginBtn" type="button">
            Sign in
          </button>
        </div>

      </div>
    </div>
  </main>
  <script type="module">
    import { login, getCurrentUser, getDashboardForRole, isAuthenticated } from '../modules/auth.js';
    import { wireInstallButton } from '../modules/pwa.js';


    // If already logged in, skip the login form entirely
    if (isAuthenticated()) {
      const user = getCurrentUser();
      window.location.href = getDashboardForRole(user?.role);
    }

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    async function handleLogin() {
      loginError.hidden = true;
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        loginError.textContent = 'Please enter both username and password.';
        loginError.hidden = false;
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const user = await login(username, password);
        window.location.href = getDashboardForRole(user.role);
      } catch (err) {
        loginError.textContent = err.message || 'Invalid username or password.';
        loginError.hidden = false;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }
    }

    loginBtn.addEventListener('click', handleLogin);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>

</html>

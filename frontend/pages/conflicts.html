<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conflicts — Sales Management System</title>
  <link rel="stylesheet" href="../assets/styles.css" />
  <link rel="shortcut icon" href="../assets/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/app-icon-192.png">
  <meta name="theme-color" content="#0B0D10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="menuToggle" class="icon-btn">☰</button>
      <h1 class="app-title">TX RetailOS</h1>
    </div>
    <div class="topbar-right">
      <button id="notifBtn" class="icon-btn">🔔</button>
      <span id="userInfo" class="text-mono"></span>
      <button id="installBtn" class="btn btn-outline" hidden>Install App</button>
      <!-- <span id="connectionStatus" class="status online">● Online</span> -->
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h2>Sync Conflicts</h2>
      </div>

      <div id="accessDenied" class="card" hidden>
        <p>You do not have permission to view this page.</p>
      </div>

      <div id="conflictsContent">
        <div id="emptyState" class="placeholder" hidden>No pending conflicts.</div>
        <div id="conflictList" class="mt-2"></div>
      </div>
    </main>
  </div>

  <div id="notifModal" class="modal hidden">
    <div class="modal-content">
      <div class="flex-between">
        <h3>Notifications</h3>
        <button id="closeNotif" class="icon-btn">✕</button>
      </div>
      <div class="placeholder">
        🔔 No new notifications yet.
      </div>
    </div>
  </div>

  <script type="module" src="../modules/conflicts_page.js">
    import { wireInstallButton } from '../modules/pwa.js';
    
    wireInstallButton();
  </script>
</body>

</html>

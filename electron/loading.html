<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0D10;
      color: #F3EFE9;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; letter-spacing: 0.02em; }
    p { color: #9AA0AA; font-size: 0.85rem; margin: 0; }
    .spinner {
      width: 28px; height: 28px; margin-bottom: 20px;
      border: 3px solid #262B32;
      border-top-color: #FF7A00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>TX RetailOS</h1>
  <p>Starting local server…</p>
</body>
</html>
